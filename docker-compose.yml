services:
  mysql:
    image: mysql:8.4
    container_name: wsi-cyber-security-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root-change-me
      MYSQL_DATABASE: wsi_mis_security
      MYSQL_USER: wsi_security
      MYSQL_PASSWORD: change-me
    ports: ["3306:3306"]
    volumes:
      - wsi_mysql_data:/var/lib/mysql
volumes:
  wsi_mysql_data:
